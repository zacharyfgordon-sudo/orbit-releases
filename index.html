<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --ink: #1d1d1f; --ink-soft: #6e6e73; --accent: #0b5c3e; --accent-deep: #07452e; --hairline: #d2d2d7; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    letter-spacing: -0.022em; color: var(--ink); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    background: #f5f5f7;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .gate {
    text-align: center; width: 100%; max-width: 380px; padding: 44px 36px 36px;
    background: #fff; border-radius: 20px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.04), 0 2px 10px rgba(0, 0, 0, 0.07);
  }
  .gate img { width: 72px; height: 72px; margin-bottom: 20px; }
  .gate h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.012em; margin-bottom: 8px; }
  .gate p { color: var(--ink-soft); font-size: 15px; line-height: 1.4; letter-spacing: -0.016em; margin-bottom: 26px; }
  .gate input {
    width: 100%; font-size: 17px; padding: 13px 16px; border: 1px solid var(--hairline);
    border-radius: 12px; outline: none; text-align: center; background: #fff; color: var(--ink);
    transition: border-color .2s, box-shadow .2s;
  }
  .gate input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(11, 92, 62, 0.14); }
  .gate button {
    margin-top: 14px; width: 100%; height: 46px; background: var(--accent); color: #fff; border: none;
    font: inherit; font-size: 17px; font-weight: 500; letter-spacing: -0.022em; border-radius: 999px; cursor: pointer;
    transition: background .2s;
  }
  .gate button:hover, .gate button:focus-visible { background: var(--accent-deep); outline: none; }
  .gate .for-pm { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .gate .err { color: #c4161c; font-size: 13.5px; margin-top: 12px; min-height: 18px; }
</style>
</head>
<body>
<form class="gate" id="gate" method="post" action="#">
  <img src="orbit-mark.png" alt="">
  <h1>Orbit</h1>
  <p>This page is private. Enter the passphrase.</p>
  <!-- A username for the browser's password manager to file the passphrase under, so it can offer it back with Touch ID / Face ID. -->
  <input class="for-pm" type="text" name="username" autocomplete="username" value="Orbit" readonly tabindex="-1" aria-hidden="true">
  <input type="password" id="pw" name="password" autocomplete="current-password" autofocus>
  <button type="submit">Enter</button>
  <div class="err" id="err"></div>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(SALT), iterations: 210000, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const raw = b64(DATA);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, key, raw.slice(12));
  return new TextDecoder().decode(plain);
}
async function attempt(pw, silent) {
  try {
    const html = await unlock(pw);
    sessionStorage.setItem("orbit-gate", pw);
    // Right passphrase: tell the browser the sign-in worked so it offers to save it (Chrome; Safari saves from the form).
    if (!silent && window.PasswordCredential) {
      try { await navigator.credentials.store(new PasswordCredential({ id: "Orbit", password: pw, name: "Orbit" })); } catch (e) {}
    }
    document.open(); document.write(html); document.close();
  } catch (e) {
    if (!silent) document.getElementById("err").textContent = "That passphrase isn\u2019t right.";
  }
}
document.getElementById("gate").addEventListener("submit", ev => {
  ev.preventDefault();
  attempt(document.getElementById("pw").value.trim(), false);
});
const saved = sessionStorage.getItem("orbit-gate");
if (saved) attempt(saved, true);
